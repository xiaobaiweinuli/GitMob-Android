# 仓库元数据分页容量由 PageSize.METADATA 传入，Issue/Discussion/PR 域共用。
query RepoLabels($owner: String!, $name: String!, $after: String, $first: Int!) {
    repository(owner: $owner, name: $name) {
        labels(first: $first, after: $after) {
            nodes {
                id
                name
                color
                description
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
    }
}

# 仓库里程碑分页（只取 OPEN）。
query RepoMilestones($owner: String!, $name: String!, $after: String, $first: Int!) {
    repository(owner: $owner, name: $name) {
        milestones(first: $first, after: $after, states: [OPEN]) {
            nodes {
                id
                number
                title
                state
                dueOn
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
    }
}

# 可指派用户分页。
query RepoAssignableUsers($owner: String!, $name: String!, $after: String, $first: Int!) {
    repository(owner: $owner, name: $name) {
        assignableUsers(first: $first, after: $after) {
            nodes {
                id
                login
                name
                avatarUrl
                bio
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
    }
}
