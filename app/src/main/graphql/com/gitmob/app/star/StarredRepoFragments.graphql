# 星标仓库卡片公共字段片段，"全部星标"和"某个列表内"两个查询字段结构完全一样。
# $topicsFirst 由消费本片段的 operation 声明，并从 PageSize.TOPICS_PER_REPO 传入。
fragment StarredRepoFields on Repository {
    id
    name
    url
    description
    homepageUrl
    owner {
        login
        avatarUrl
    }
    isPrivate
    isArchived
    isFork
    parent {
        name
        owner {
            login
            avatarUrl
        }
    }
    primaryLanguage {
        name
        color
    }
    stargazerCount
    forkCount
    issues(states: [OPEN]) {
        totalCount
    }
    repositoryTopics(first: $topicsFirst) {
        nodes {
            topic {
                name
            }
        }
    }
    defaultBranchRef {
        name
    }
}
