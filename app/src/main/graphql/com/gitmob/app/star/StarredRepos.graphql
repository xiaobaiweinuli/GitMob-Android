# 当前登录用户自己的星标仓库（底部 Tab 星标页）。first: 20 = PageSize.STARRED_REPOS。
query ViewerStarredRepos($after: String) {
    viewer {
        starredRepositories(first: 20, after: $after, orderBy: { field: STARRED_AT, direction: DESC }) {
            totalCount
            edges {
                node {
                    ...StarredRepoFields
                }
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
    }
}

# 指定用户的公开星标仓库（他人星标页）。
query UserStarredRepos($login: String!, $after: String) {
    user(login: $login) {
        starredRepositories(first: 20, after: $after, orderBy: { field: STARRED_AT, direction: DESC }) {
            totalCount
            edges {
                node {
                    ...StarredRepoFields
                }
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
    }
}
