# 当前登录用户自己的星标仓库（底部 Tab 星标页）。容量由 Repository 从 PageSize 传入。
query ViewerStarredRepos($after: String, $first: Int!, $topicsFirst: Int!) {
    viewer {
        starredRepositories(first: $first, after: $after, orderBy: { field: STARRED_AT, direction: DESC }) {
            totalCount
            edges {
                node {
                    ...StarredRepoFields
                }
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
    }
}

# 指定用户的公开星标仓库（他人星标页）。
query UserStarredRepos($login: String!, $after: String, $first: Int!, $topicsFirst: Int!) {
    user(login: $login) {
        starredRepositories(first: $first, after: $after, orderBy: { field: STARRED_AT, direction: DESC }) {
            totalCount
            edges {
                node {
                    ...StarredRepoFields
                }
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
    }
}
