# "添加到列表"弹窗预勾选：公开 API 没有从仓库反查所属列表的字段，
# 只能拉出全部列表 + 每个列表的 items，客户端自己算交集。
# first: 20 = PageSize.STAR_LISTS_SCAN_LIMIT，items first: 100 = PageSize.LIST_ITEMS_SCAN_LIMIT。
query ListsContainingRepo {
    viewer {
        lists(first: 20) {
            nodes {
                id
                items(first: 100) {
                    nodes {
                        ... on Repository {
                            id
                        }
                    }
                }
            }
        }
    }
}
