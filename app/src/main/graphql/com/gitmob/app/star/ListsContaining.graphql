# "添加到列表"弹窗预勾选：公开 API 没有从仓库反查所属列表的字段，
# 只能预取列表 + 每个列表的 items，客户端自己算交集。
# 容量分别由 PageSize.STAR_LISTS_SCAN_LIMIT / LIST_ITEMS_SCAN_LIMIT 传入。
query ListsContainingRepo($listsFirst: Int!, $itemsFirst: Int!) {
    viewer {
        lists(first: $listsFirst) {
            nodes {
                id
                items(first: $itemsFirst) {
                    nodes {
                        ... on Repository {
                            id
                        }
                    }
                }
            }
        }
    }
}
