# "我的列表"横排 chip：每个列表只读 totalCount，不加载项目。容量由 PageSize.STAR_LISTS 传入。
query ViewerLists($first: Int!) {
    viewer {
        lists(first: $first) {
            nodes {
                id
                name
                slug
                description
                isPrivate
                items(first: 1) {
                    totalCount
                }
            }
        }
    }
}
