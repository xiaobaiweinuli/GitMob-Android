# PR 各 mutation。返回体统一用 PullRequestFields 片段，commentCount 取 totalCommentsCount。
mutation CreateRepoPullRequest($input: CreatePullRequestInput!, $metadataFirst: Int!) {
    createPullRequest(input: $input) {
        pullRequest {
            ...PullRequestFields
        }
    }
}

mutation UpdateRepoPullRequest($input: UpdatePullRequestInput!, $metadataFirst: Int!) {
    updatePullRequest(input: $input) {
        pullRequest {
            ...PullRequestFields
        }
    }
}

mutation CloseRepoPullRequest($input: ClosePullRequestInput!, $metadataFirst: Int!) {
    closePullRequest(input: $input) {
        pullRequest {
            ...PullRequestFields
        }
    }
}

mutation ReopenRepoPullRequest($input: ReopenPullRequestInput!, $metadataFirst: Int!) {
    reopenPullRequest(input: $input) {
        pullRequest {
            ...PullRequestFields
        }
    }
}

mutation ConvertPullRequestToDraft($input: ConvertPullRequestToDraftInput!, $metadataFirst: Int!) {
    convertPullRequestToDraft(input: $input) {
        pullRequest {
            ...PullRequestFields
        }
    }
}

mutation MarkPullRequestReadyForReview($input: MarkPullRequestReadyForReviewInput!, $metadataFirst: Int!) {
    markPullRequestReadyForReview(input: $input) {
        pullRequest {
            ...PullRequestFields
        }
    }
}

mutation UpdateRepoPullRequestBranch($input: UpdatePullRequestBranchInput!, $metadataFirst: Int!) {
    updatePullRequestBranch(input: $input) {
        pullRequest {
            ...PullRequestFields
        }
    }
}

mutation MergeRepoPullRequest($input: MergePullRequestInput!, $metadataFirst: Int!) {
    mergePullRequest(input: $input) {
        pullRequest {
            ...PullRequestFields
        }
    }
}

mutation EnablePullRequestAutoMerge($input: EnablePullRequestAutoMergeInput!, $metadataFirst: Int!) {
    enablePullRequestAutoMerge(input: $input) {
        pullRequest {
            ...PullRequestFields
        }
    }
}

mutation DisablePullRequestAutoMerge($input: DisablePullRequestAutoMergeInput!, $metadataFirst: Int!) {
    disablePullRequestAutoMerge(input: $input) {
        pullRequest {
            ...PullRequestFields
        }
    }
}

mutation AddPullRequestComment($input: AddCommentInput!) {
    addComment(input: $input) {
        commentEdge {
            node {
                ...PullRequestCommentFields
            }
        }
    }
}

mutation UpdatePullRequestComment($input: UpdateIssueCommentInput!) {
    updateIssueComment(input: $input) {
        issueComment {
            ...PullRequestCommentFields
        }
    }
}

mutation DeletePullRequestComment($input: DeleteIssueCommentInput!) {
    deleteIssueComment(input: $input) {
        clientMutationId
    }
}

mutation AddPullRequestReview($input: AddPullRequestReviewInput!) {
    addPullRequestReview(input: $input) {
        pullRequestReview {
            ...PullRequestReviewFields
        }
    }
}

mutation RequestPullRequestReviews($input: RequestReviewsInput!) {
    requestReviews(input: $input) {
        clientMutationId
    }
}

mutation ReplyPullRequestThread($input: AddPullRequestReviewThreadReplyInput!) {
    addPullRequestReviewThreadReply(input: $input) {
        comment {
            ...PullRequestReviewCommentFields
        }
    }
}

mutation ResolveReviewThread($input: ResolveReviewThreadInput!) {
    resolveReviewThread(input: $input) {
        thread {
            id
            isResolved
        }
    }
}

mutation UnresolveReviewThread($input: UnresolveReviewThreadInput!) {
    unresolveReviewThread(input: $input) {
        thread {
            id
            isResolved
        }
    }
}

mutation UpdatePullRequestSubscription($input: UpdateSubscriptionInput!) {
    updateSubscription(input: $input) {
        subscribable {
            viewerSubscription
        }
    }
}
