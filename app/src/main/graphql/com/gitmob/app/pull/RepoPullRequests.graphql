# PR 分页列表。容量由 PageSize.REPO_ISSUES / METADATA 传入。
query RepoPullRequests($owner: String!, $name: String!, $after: String, $states: [PullRequestState!], $orderBy: IssueOrder!, $labels: [String!], $first: Int!, $metadataFirst: Int!) {
    repository(owner: $owner, name: $name) {
        id
        viewerPermission
        hasPullRequestsEnabled
        pullRequestCreationPolicy
        defaultBranchRef {
            name
        }
        mergeCommitAllowed
        squashMergeAllowed
        rebaseMergeAllowed
        pullRequests(first: $first, after: $after, states: $states, labels: $labels, orderBy: $orderBy) {
            totalCount
            nodes {
                ...PullRequestFields
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
    }
}

# PR 详情：评论分页 + reviews + reviewThreads + commits。
# 各连接容量分别由 Repository 从对应 PageSize 常量传入。
query RepoPullRequestDetail($owner: String!, $name: String!, $number: Int!, $after: String, $commentsFirst: Int!, $reviewsFirst: Int!, $reviewThreadsFirst: Int!, $reviewCommentsFirst: Int!, $commitsFirst: Int!, $metadataFirst: Int!) {
    repository(owner: $owner, name: $name) {
        id
        viewerPermission
        mergeCommitAllowed
        squashMergeAllowed
        rebaseMergeAllowed
        pullRequest(number: $number) {
            ...PullRequestFields
            comments(first: $commentsFirst, after: $after) {
                nodes {
                    ...PullRequestCommentFields
                }
                pageInfo {
                    hasNextPage
                    endCursor
                }
            }
            reviews(first: $reviewsFirst) {
                nodes {
                    ...PullRequestReviewFields
                }
            }
            reviewThreads(first: $reviewThreadsFirst) {
                nodes {
                    id
                    path
                    line
                    isResolved
                    isOutdated
                    viewerCanReply
                    viewerCanResolve
                    viewerCanUnresolve
                    comments(first: $reviewCommentsFirst) {
                        nodes {
                            ...PullRequestReviewCommentFields
                        }
                    }
                }
            }
            commits(first: $commitsFirst) {
                nodes {
                    commit {
                        oid
                        messageHeadline
                        committedDate
                        author {
                            user {
                                login
                                avatarUrl
                            }
                        }
                    }
                }
            }
        }
    }
}
