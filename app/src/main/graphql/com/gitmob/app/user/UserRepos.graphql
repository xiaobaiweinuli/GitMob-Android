# 指定用户的仓库列表（他人主页 → 仓库统计项），ownerAffiliations 只传 OWNER
query UserRepos($login: String!, $after: String, $first: Int!, $topicsFirst: Int!) {
  user(login: $login) {
    repositories(first: $first, after: $after, ownerAffiliations: [OWNER]) {
      totalCount
      nodes {
        name
        owner { login avatarUrl }
        description
        homepageUrl
        visibility
        isArchived
        isFork
        hasIssuesEnabled
        createdAt
        updatedAt
        pushedAt
        parent { name owner { login avatarUrl } }
        primaryLanguage { name color }
        stargazerCount
        forkCount
        issues(states: [OPEN]) { totalCount }
        repositoryTopics(first: $topicsFirst) { nodes { topic { name } } }
        defaultBranchRef { name }
      }
      pageInfo { hasNextPage endCursor }
    }
  }
}
