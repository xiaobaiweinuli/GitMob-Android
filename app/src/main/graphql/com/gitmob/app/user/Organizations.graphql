# 组织 BottomSheet 轻量预览（不分页，容量由 PageSize.ORGS_PREVIEW 传入）
query ViewerOrganizations($first: Int!) {
  viewer { organizations(first: $first) { nodes { login name avatarUrl } } }
}

query UserOrganizations($login: String!, $first: Int!) {
  user(login: $login) { organizations(first: $first) { nodes { login name avatarUrl } } }
}
