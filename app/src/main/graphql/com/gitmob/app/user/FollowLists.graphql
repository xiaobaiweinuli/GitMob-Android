query Followers($login: String!, $after: String, $first: Int!) {
  user(login: $login) {
    followers(first: $first, after: $after) {
      totalCount
      nodes { login name avatarUrl bio }
      pageInfo { hasNextPage endCursor }
    }
  }
}

query Following($login: String!, $after: String, $first: Int!) {
  user(login: $login) {
    following(first: $first, after: $after) {
      totalCount
      nodes { login name avatarUrl bio }
      pageInfo { hasNextPage endCursor }
    }
  }
}
