# A code-search permalink identifies a commit, not a mutable branch.
query RepoFileSnapshot($owner: String!, $name: String!, $commit: String!, $expression: String!) {
  repository(owner: $owner, name: $name) {
    id
    viewerPermission
    isArchived
    commit: object(expression: $commit) { ... on Commit { oid } }
    object(expression: $expression) {
      ... on Blob { oid byteSize isBinary isTruncated text }
    }
  }
}
