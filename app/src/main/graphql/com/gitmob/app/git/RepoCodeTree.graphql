# 代码树（目录条目）
query RepoCodeTree($owner: String!, $name: String!, $qualifiedRef: String!, $revision: String!, $path: String!) {
  repository(owner: $owner, name: $name) {
    id
    isFork
    viewerPermission
    isArchived
    ref(qualifiedName: $qualifiedRef) { name target { ...RepoTreeCommitFields } }
    commit: object(expression: $revision) { ...RepoTreeCommitFields }
  }
}

fragment RepoTreeCommitFields on Commit {
  oid
  file(path: $path) {
    object {
      ... on Tree {
        entries { name path type oid size extension language { name } }
      }
    }
  }
}

# 文件内容（Blob），同时识别目录目标
query RepoFileContent($owner: String!, $name: String!, $qualifiedRef: String!, $revision: String!, $path: String!) {
  repository(owner: $owner, name: $name) {
    id
    viewerPermission
    isArchived
    ref(qualifiedName: $qualifiedRef) { name target { ...RepoFileCommitFields } }
    commit: object(expression: $revision) { ...RepoFileCommitFields }
  }
}

fragment RepoFileCommitFields on Commit {
  oid
  file(path: $path) {
    object {
      ... on Blob { oid byteSize isBinary isTruncated text }
    }
  }
}
