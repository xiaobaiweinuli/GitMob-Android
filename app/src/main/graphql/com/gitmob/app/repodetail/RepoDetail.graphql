# 仓库详情。first: 0 只取连接计数；releases first: 1 只取最新一条，不是列表分页。
query RepoDetail($owner: String!, $name: String!, $topicsFirst: Int!) {
  repository(owner: $owner, name: $name) {
    id
    name
    description
    homepageUrl
    url
    visibility
    owner { login avatarUrl ... on User { isViewer } ... on Organization { id } }
    isPrivate
    isArchived
    isTemplate
    isFork
    parent { name owner { login avatarUrl } }
    stargazerCount
    viewerHasStarred
    forkCount
    forkingAllowed
    issues(states: [OPEN]) { totalCount }
    pullRequests(states: [OPEN]) { totalCount }
    watchers(first: 0) { totalCount }
    viewerSubscription
    viewerCanSubscribe
    licenseInfo { name spdxId }
    refs(refPrefix: "refs/heads/", first: 0) { totalCount }
    defaultBranchRef { name }
    releases(first: 1, orderBy: { field: CREATED_AT, direction: DESC }) {
      totalCount
      nodes { name tagName }
    }
    primaryLanguage { name color }
    repositoryTopics(first: $topicsFirst) { nodes { topic { name } } }
    viewerPermission
    viewerCanCreateIssues
    hasIssuesEnabled
    isBlankIssuesEnabled
    issueCreationPolicy
    hasPullRequestsEnabled
    pullRequestCreationPolicy
    hasDiscussionsEnabled
    discussions(states: [OPEN], first: 0) { totalCount }
  }
}

query RepoManagementTopics($owner: String!, $name: String!, $after: String, $first: Int!) {
  repository(owner: $owner, name: $name) {
    repositoryTopics(first: $first, after: $after) {
      nodes { topic { name } }
      pageInfo { hasNextPage endCursor }
    }
  }
}

query RepoManagementIdentity($id: ID!) {
  node(id: $id) { ... on Repository { name owner { login } } }
}

query RepoTransferTarget($login: String!, $name: String!) {
  repositoryOwner(login: $login) {
    id
    login
    avatarUrl
    ... on User { name }
    ... on Organization { name viewerCanCreateRepositories }
    repository(name: $name, followRenames: false) { id }
  }
}
