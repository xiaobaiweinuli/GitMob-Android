# 仓库 Discussion 分页列表 + 分类列表。
# 分类、列表与标签容量分别由 Repository 从 PageSize 传入。
query RepoDiscussions($owner: String!, $name: String!, $after: String, $states: [DiscussionState!], $orderBy: DiscussionOrder, $categoryId: ID, $answered: Boolean, $first: Int!, $categoriesFirst: Int!, $metadataFirst: Int!) {
    repository(owner: $owner, name: $name) {
        id
        viewerPermission
        hasDiscussionsEnabled
        categories: discussionCategories(first: $categoriesFirst) {
            nodes {
                ...DiscussionCategoryFields
            }
        }
        discussions(first: $first, after: $after, states: $states, orderBy: $orderBy, categoryId: $categoryId, answered: $answered) {
            totalCount
            nodes {
                ...DiscussionFields
                comments {
                    totalCount
                }
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
    }
}

# 单个 Discussion 详情 + 评论分页。评论容量由 PageSize.ISSUE_COMMENTS 传入。
query RepoDiscussionDetail($owner: String!, $name: String!, $number: Int!, $after: String, $commentsFirst: Int!, $categoriesFirst: Int!, $metadataFirst: Int!) {
    repository(owner: $owner, name: $name) {
        id
        viewerPermission
        categories: discussionCategories(first: $categoriesFirst) {
            nodes {
                ...DiscussionCategoryFields
            }
        }
        discussion(number: $number) {
            ...DiscussionFields
            comments(first: $commentsFirst, after: $after) {
                totalCount
                nodes {
                    ...DiscussionCommentFields
                }
                pageInfo {
                    hasNextPage
                    endCursor
                }
            }
        }
    }
}
