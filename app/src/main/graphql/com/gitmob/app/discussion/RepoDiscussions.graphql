# 仓库 Discussion 分页列表 + 分类列表。
# categories first: 100 = PageSize.DISCUSSION_CATEGORIES；discussions first: 20 = PageSize.REPO_ISSUES。
query RepoDiscussions($owner: String!, $name: String!, $after: String, $states: [DiscussionState!], $orderBy: DiscussionOrder, $categoryId: ID, $answered: Boolean) {
    repository(owner: $owner, name: $name) {
        id
        viewerPermission
        hasDiscussionsEnabled
        categories: discussionCategories(first: 100) {
            nodes {
                ...DiscussionCategoryFields
            }
        }
        discussions(first: 20, after: $after, states: $states, orderBy: $orderBy, categoryId: $categoryId, answered: $answered) {
            totalCount
            nodes {
                ...DiscussionFields
                comments {
                    totalCount
                }
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
    }
}

# 单个 Discussion 详情 + 评论分页。comments first: 20 = PageSize.ISSUE_COMMENTS。
query RepoDiscussionDetail($owner: String!, $name: String!, $number: Int!, $after: String) {
    repository(owner: $owner, name: $name) {
        id
        viewerPermission
        categories: discussionCategories(first: 100) {
            nodes {
                ...DiscussionCategoryFields
            }
        }
        discussion(number: $number) {
            ...DiscussionFields
            comments(first: 20, after: $after) {
                totalCount
                nodes {
                    ...DiscussionCommentFields
                }
                pageInfo {
                    hasNextPage
                    endCursor
                }
            }
        }
    }
}
