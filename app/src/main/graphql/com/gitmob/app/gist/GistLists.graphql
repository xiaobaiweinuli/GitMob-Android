# Gist 列表（当前用户）：隐私 ALL，排序/游标由变量控制
query ViewerGists($after: String, $orderBy: GistOrder, $first: Int!, $fileMetadataLimit: Int!) {
  viewer {
    login
    gists(first: $first, after: $after, privacy: ALL, orderBy: $orderBy) {
      ...GistConnectionFields
    }
  }
}

# Gist 列表（他人公开）：根字段 user(login:)，viewer.login 仅用于归属判断
query UserGists($login: String!, $after: String, $orderBy: GistOrder, $first: Int!, $fileMetadataLimit: Int!) {
  viewer { login }
  user(login: $login) {
    login
    gists(first: $first, after: $after, privacy: PUBLIC, orderBy: $orderBy) {
      ...GistConnectionFields
    }
  }
}

# Gist 详情动作区：计数与 viewer 星标状态来自 Starrable/Gist 连接，不能用 REST 当前页数量代替。
query GistSocial($id: ID!) {
  node(id: $id) {
    ... on Gist {
      stargazerCount
      viewerHasStarred
      forks(first: 1) { totalCount }
    }
  }
}

query GistStargazers($id: ID!, $after: String, $first: Int!) {
  node(id: $id) {
    ... on Gist {
      stargazers(first: $first, after: $after) {
        totalCount
        nodes { login name avatarUrl bio }
        pageInfo { hasNextPage endCursor }
      }
    }
  }
}

# $fileMetadataLimit 由消费本片段的 operation 声明，并由 Repository 从 PageSize 传入。
fragment GistConnectionFields on GistConnection {
  edges {
    cursor
    node {
      id
      name
      description
      owner { login }
      isPublic
      isFork
      createdAt
      updatedAt
      stargazerCount
      comments { totalCount }
      url
      # 只取第一个文件用于卡片预览，不是普通文件列表分页。
      previewFiles: files(limit: 1) {
        name
        text(truncate: 4000)
        size
        isTruncated
        isImage
        language { name color }
      }
      fileMetadata: files(limit: $fileMetadataLimit) { name }
    }
  }
  pageInfo { hasNextPage endCursor }
}
