# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

# 1. 堆内存提至 4096m（4G），并指定 GC 优化器与 Metaspace，彻底防止 D8 / KSP 内存溢出
#    -Djdk.tls.client.protocols / https.protocols: 开启完整 TLSv1~v1.3，兼容 dl.google.com 等需要握手协商的 Maven 源
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8 -Djdk.tls.client.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3 -Dhttps.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3

# 2. 基础 Android & Kotlin 规范
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 3. Kotlin 编译器与 KSP 独立进程内存（2G 非常合适）
kotlin.daemon.jvmargs=-Xmx2048m
kotlin.incremental=true
ksp.incremental=true

# 4. 构建性能与缓存
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 5. KSP 增量与并行编译加速（针对 AGP 8.x + Kotlin 2.x）
ksp.incremental.intermodule=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
